services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: store_app_8002
    restart: unless-stopped
    ports:
      - "8002:8002"
    env_file:
      - path: .env
        required: false
    volumes:
      - ./storage:/var/www/html/storage
      - ./database:/var/www/html/database
